<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">
        <title>Administrar Productos</title>

    <div id="head-placeholder"></div>

</head>

<body>

    <header id="header-placeholder"></header>

    <main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="titulo-admin mb-1">
                Administrar Productos
            </h2>

            <p class="text-admin mb-0">
                Gestiona las hamburguesas disponibles en el menú.
            </p>

        </div>

        <button
            class="btn btn-burger"
            onclick="abrirModalNuevo()">

            <i class="bi bi-plus-circle-fill me-2"></i>
            Nuevo producto

        </button>

    </div>

    <div class="card admin-card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table
                    class="table table-hover align-middle mb-0"
                    id="tabla-productos">

                    <thead class="thead-burger">

                        <tr>

                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Estado</th>
                            <th width="190">Acciones</th>

                        </tr>

                    </thead>

                    <tbody>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>
    <!-- ===================== MODAL PRODUCTO ===================== -->

 <!-- ===================== MODAL PRODUCTO ===================== -->

<div class="modal fade" id="modalProducto" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content border-0 shadow-lg rounded-4">

            <!-- CABECERA -->

            <div class="modal-header modal-burger">

                <h4 id="tituloModal" class="fw-bold mb-0">

                    <i class="bi bi-bag-plus-fill me-2"></i>

                    Nuevo Producto

                </h4>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <form id="formProducto" enctype="multipart/form-data">

                <div class="modal-body p-4">

                    <input
                        type="hidden"
                        name="action"
                        id="action"
                        value="guardar">

                    <input
                        type="hidden"
                        name="idProducto"
                        id="idProducto">

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Nombre del producto

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            placeholder="Ej. Hamburguesa BBQ"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Descripción

                        </label>

                        <textarea
                            class="form-control"
                            id="descripcion"
                            name="descripcion"
                            rows="3"
                            placeholder="Describe los ingredientes..."
                            required></textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <div class="mb-3">

                                <label class="form-label fw-semibold">

                                    Precio

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        S/

                                    </span>

                                    <input
                                        type="number"
                                        step="0.01"
                                        class="form-control"
                                        id="precio"
                                        name="precio"
                                        placeholder="0.00"
                                        required>

                                </div>

                            </div>

                        </div>

                        <div class="col-md-6">

                            <div class="mb-3">

                                <label class="form-label fw-semibold">

                                    Imagen

                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    id="imagen"
                                    name="imagen"
                                    accept="image/*">

                            </div>

                        </div>

                    </div>

                </div>

                <div class="modal-footer border-0 px-4 pb-4">

                    <button
                        type="button"
                        class="btn btn-burger-outline"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        class="btn btn-burger"
                        type="submit">

                        <i class="bi bi-check-circle-fill me-2"></i>

                        Guardar producto

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

    <footer id="footer-placeholder"></footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/admin_productos.js"></script>

</body>

</html>
