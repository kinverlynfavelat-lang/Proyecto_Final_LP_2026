<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">
        <title>Administrar Productos</title>

    <div id="head-placeholder"></div>

</head>

<body>

    <header id="header-placeholder"></header>

    <main class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">
                Administrar Productos
            </h2>

            <button
                class="btn btn-success"
                onclick="abrirModalNuevo()">

                <i class="bi bi-plus-circle"></i>

                Nuevo producto

            </button>

        </div>

        <div class="card shadow">

            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle"
                        id="tabla-productos">

                        <thead class="table-dark">

                            <tr>

                                <th>Imagen</th>

                                <th>Nombre</th>

                                <th>Descripción</th>

                                <th>Precio</th>

                                <th>Estado</th>

                                <th width="180">
                                    Acciones
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>
    <!-- ===================== MODAL PRODUCTO ===================== -->

    <div class="modal fade" id="modalProducto" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header bg-dark text-white">

                    <h5 id="tituloModal">
                        Nuevo Producto
                    </h5>

                    <button
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <form id="formProducto" enctype="multipart/form-data">

                    <div class="modal-body">

                        <input
                            type="hidden"
                            name="action"
                            id="action"
                            value="guardar">

                        <input
                            type="hidden"
                            name="idProducto"
                            id="idProducto">

                        <div class="mb-3">

                            <label>Nombre</label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                name="nombre"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Descripción</label>

                            <textarea
                                class="form-control"
                                id="descripcion"
                                name="descripcion"
                                rows="3"
                                required></textarea>

                        </div>

                        <div class="mb-3">

                            <label>Precio</label>

                            <input
                                type="number"
                                step="0.01"
                                class="form-control"
                                id="precio"
                                name="precio"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Imagen</label>

                            <input
                                type="file"
                                class="form-control"
                                id="imagen"
                                name="imagen"
                                accept="image/*">

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancelar

                        </button>

                        <button
                            class="btn btn-success"
                            type="submit">

                            Guardar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <footer id="footer-placeholder"></footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/admin_productos.js"></script>

</body>

</html>
