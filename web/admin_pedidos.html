<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Administrar Pedidos</title>

    <div id="head-placeholder"></div>

</head>

<body>

    <!-- HEADER -->
    <header id="header-placeholder"></header>

    <!-- CONTENIDO -->
    <main class="container py-5">

        <!-- TÍTULO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="titulo-admin mb-1">
                    Gestión de Pedidos
                </h2>

                <p class="text-admin mb-0">
                    Visualiza, administra y actualiza el estado de los pedidos realizados por los clientes.
                </p>

            </div>

        </div>

        <!-- TARJETA -->
        <div class="card admin-card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle mb-0"
                        id="tabla-pedidos">

                        <thead class="thead-burger">

                            <tr>

                                <th>Código</th>

                                <th>Cliente</th>

                                <th>Fecha</th>

                                <th>Método</th>

                                <th>Total</th>

                                <th>Estado</th>

                                <th width="180">
                                    Acciones
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            <!-- Se llena desde admin_pedidos.js -->

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <!-- ======================= -->
    <!-- MODAL DETALLE PEDIDO -->
    <!-- ======================= -->

    <div
        class="modal fade"
        id="modalPedido"
        tabindex="-1">

        <div class="modal-dialog modal-dialog-centered modal-lg">

            <div class="modal-content border-0 shadow-lg rounded-4">

                <!-- CABECERA -->

                <div class="modal-header modal-burger">

                    <h4 class="fw-bold mb-0">

                        <i class="bi bi-receipt-cutoff-fill me-2"></i>

                        Detalle del Pedido

                    </h4>

                    <button
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <!-- CUERPO -->

                <div
                    class="modal-body p-4"
                    id="contenidoPedido">

                    <!-- admin_pedidos.js inserta aquí el detalle -->

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->

    <footer id="footer-placeholder"></footer>

    <!-- JS -->

    <script src="assets/js/main.js"></script>

    <script src="assets/js/admin_pedidos.js"></script>

</body>

</html>
