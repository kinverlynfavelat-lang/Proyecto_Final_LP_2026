<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Administrar Pagos</title>

    <div id="head-placeholder"></div>

</head>

<body>

<header id="header-placeholder"></header>

<main class="container py-5">

    <!-- TÍTULO -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold text-burger-title mb-1">
                Administrar Pagos
            </h2>

            <p class="text-muted mb-0">
                Revisa, aprueba o rechaza los comprobantes enviados por los clientes.
            </p>

        </div>

    </div>

    <!-- TARJETA -->
    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table
                    class="table table-hover align-middle"
                    id="tabla-pagos">

                    <thead class="thead-burger">

                        <tr>

                            <th>ID Pedido</th>

                            <th>Método</th>

                            <th>Estado</th>

                            <th>Fecha</th>

                            <th>Comprobante</th>

                            <th width="220">
                                Acciones
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<footer id="footer-placeholder"></footer>

<script src="assets/js/main.js"></script>
<script src="assets/js/admin_pagos.js"></script>

</body>

</html>
